<!-- src/app/mission-assign/mission-assign.component.html -->
<div class="mb-2">
  <label for="personnelSelect">Assigner un membre :</label>
  <select
    id="personnelSelect"
    class="form-select"
    [(ngModel)]="selectedPersonnelId"
    name="personnel"
  >
    <option [ngValue]="undefined" disabled selected>Choisissez un membre</option>
    <option *ngFor="let p of personnel" [ngValue]="p.Identifiant">
      {{ p.Prenom }} {{ p.Nom }} ({{ p.User }})
    </option>
  </select>
</div>

<button
  class="btn btn-sm btn-primary"
  (click)="assignMission()"
  [disabled]="!selectedPersonnelId || isLoading"
>
  Assign
</button>

<div *ngIf="errorMessage" class="text-danger mt-1">
  {{ errorMessage }}
</div>
