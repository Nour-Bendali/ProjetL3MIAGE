<!-- Conteneur principal de la page de gestion du personnel -->
<div class="container">

  <!-- Bouton pour revenir à la page précédente -->
  <button class="btn btn-secondary mb-3" (click)="goBack()">Retour</button>

  <!-- Titre de la page -->
  <h2>Gestion du Personnel</h2>

  <!-- Section pour ajouter un membre au projet -->
  <h4>Ajouter un membre au projet</h4>
  <div class="input-group mb-4">
    <!-- Liste déroulante des membres disponibles -->
    <select
      class="form-select"
      name="availableSelect"
      [(ngModel)]="selectedAvailablePersonnelId"
    >
      <option [ngValue]="null">Sélectionnez un membre</option>
      <option
        *ngFor="let p of availablePersonnel"
        [ngValue]="p.Identifiant"
      >
        {{ p.Prenom }} {{ p.Nom }}
      </option>
    </select>
    <!-- Bouton pour ajouter le membre sélectionné -->
    <button
      class="btn btn-primary"
      (click)="addMember()"
    >
      Ajouter
    </button>
  </div>

  <!-- Section pour supprimer un membre du projet -->
  <h4>Supprimer un membre du projet</h4>
  <div class="input-group mb-4">
    <!-- Liste déroulante des membres actuellement affectés -->
    <select
      class="form-select"
      name="assignedSelect"
      [(ngModel)]="selectedAssignedPersonnelId"
    >
      <option [ngValue]="null">Sélectionnez un membre</option>
      <option
        *ngFor="let p of assignedPersonnel"
        [ngValue]="p.Identifiant"
      >
        {{ p.Prenom }} {{ p.Nom }}
      </option>
    </select>
    <!-- Bouton pour supprimer le membre sélectionné -->
    <button
      class="btn btn-danger"
      (click)="removeMember()"
    >
      Supprimer
    </button>
  </div>

</div>
