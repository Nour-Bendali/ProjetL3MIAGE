<div class="container">

  <button class="btn btn-secondary mb-3" (click)="goBack()">Retour</button>

  <h2>Gestion du Personnel</h2>

  <!-- Ajouter un membre -->
  <h4>Ajouter un membre au projet</h4>
  <div class="input-group mb-4">
    <select
      class="form-select"
      name="availableSelect"
      [(ngModel)]="selectedAvailablePersonnelId"
    >
      <option [ngValue]="null">Sélectionnez un membre</option>
      <option
        *ngFor="let p of availablePersonnel"
        [ngValue]="p.Identifiant"
      >
        {{ p.Prenom }} {{ p.Nom }}
      </option>
    </select>
    <!-- [disabled]="!isCreator || !selectedAvailablePersonnelId" -->
    <button
      class="btn btn-primary"
      (click)="addMember()"
    >
      Ajouter
    </button>
  </div>

  <!-- Supprimer un membre -->
  <h4>Supprimer un membre du projet</h4>
  <div class="input-group mb-4">
    <select
      class="form-select"
      name="assignedSelect"
      [(ngModel)]="selectedAssignedPersonnelId"
    >
      <option [ngValue]="null">Sélectionnez un membre</option>
      <option
        *ngFor="let p of assignedPersonnel"
        [ngValue]="p.Identifiant"
      >
        {{ p.Prenom }} {{ p.Nom }}
      </option>
    </select>
    <!-- [disabled]="!isCreator || !selectedAssignedPersonnelId" -->
    <button
      class="btn btn-danger"
      (click)="removeMember()"
    >
      Supprimer
    </button>
  </div>

</div>
