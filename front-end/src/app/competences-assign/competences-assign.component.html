<div class="container mt-4">
  <h2>Assigner une compétence à une mission</h2>

  <!-- Sélection de la mission -->
  <div class="mb-3">
    <label for="missionSelect" class="form-label">Mission :</label>
    <select id="missionSelect" class="form-select" [(ngModel)]="selectedMissionId">
      <option [ngValue]="null">-- Sélectionner une mission --</option>
      <option *ngFor="let mission of missions" [ngValue]="mission.IdMission">
        {{ mission.Titre }} (Projet : {{ mission.NomProjet }})
      </option>
    </select>
  </div>

  <!-- Sélection de la compétence -->
  <div class="mb-3">
    <label for="competenceSelect" class="form-label">Compétence :</label>
    <select id="competenceSelect" class="form-select" [(ngModel)]="selectedCompetenceId">
      <option [ngValue]="null">-- Sélectionner une compétence --</option>
      <option *ngFor="let competence of competences" [ngValue]="competence.IdentifiantC">
        {{ competence.Competence }}
      </option>
    </select>
  </div>

  <!-- Bouton d'assignation -->
  <button class="btn btn-primary" (click)="assignCompetence()" [disabled]="!selectedMissionId || !selectedCompetenceId">
    Assigner la compétence
  </button>
</div>
