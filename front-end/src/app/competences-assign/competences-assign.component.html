<div class="competence-assign">
  <!-- Affichage erreur -->
  <div *ngIf="errorMessage" class="alert alert-danger p-1 mb-2" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Sélecteur de compétence -->
  <div class="input-group input-group-sm mb-2">
    <select
      class="form-select"
      [(ngModel)]="selectedCompetenceId"
      [disabled]="isLoading">
      <option [ngValue]="null">-- Sélectionner une compétence --</option>
      <option *ngFor="let c of competences" [ngValue]="c.IdentifiantC">
        {{ c.Competence }}
      </option>
    </select>
    <button
      class="btn btn-sm btn-outline-primary"
      (click)="assignCompetence()"
      [disabled]="!selectedCompetenceId || isLoading">
      <i
        class="fas"
        [class.fa-plus]="!isLoading"
        [class.fa-spinner]="isLoading"
        [class.fa-spin]="isLoading">
      </i>
      <span *ngIf="!isLoading">Ajouter</span>
      <span *ngIf="isLoading">Ajout...</span>
    </button>
  </div>
</div>
